# ════════════════════════════════════════════════════════════════
#  Shanu Fx Private Downloader — GitHub Actions Build Workflow
#
#  Triggers:
#    • Every push to main/master
#    • Every version tag  (e.g. v1.0.0)
#    • Manual run from GitHub Actions tab
#
#  Output:
#    • ShanuFxDownloader.exe   (attached to the GitHub Release)
#    • Also available as a build artifact for 7 days
# ════════════════════════════════════════════════════════════════

name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:     [ "v*.*.*" ]        # triggers release on version tags

  workflow_dispatch:               # manual trigger from GitHub UI
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build EXE on Windows
    runs-on: windows-latest        # ← real Windows VM — produces a real .exe

    steps:

      # ── 1. Checkout your code ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"             # caches pip packages between runs (faster)

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Download FFmpeg for bundling ──────────────────────────────────────
      - name: Download FFmpeg binaries
        shell: pwsh
        run: |
          $url  = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $dest = "ffmpeg.zip"
          Write-Host "Downloading FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile $dest -TimeoutSec 120

          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path $dest -DestinationPath "ffmpeg_tmp" -Force

          # Find and copy ffmpeg.exe + ffprobe.exe into assets/ffmpeg/
          New-Item -ItemType Directory -Force -Path "assets\ffmpeg"
          Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffmpeg.exe"  | Copy-Item -Destination "assets\ffmpeg\"
          Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffprobe.exe" | Copy-Item -Destination "assets\ffmpeg\"

          Write-Host "FFmpeg ready:"
          Get-ChildItem assets\ffmpeg\

      # ── 5. Build the EXE with PyInstaller ─────────────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "ShanuFxDownloader" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL.ImageDraw `
            --hidden-import yt_dlp `
            --hidden-import yt_dlp.utils `
            --hidden-import yt_dlp.extractor `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog `
            --hidden-import requests `
            --hidden-import urllib.request `
            --hidden-import threading `
            --hidden-import pathlib `
            --hidden-import json `
            --hidden-import subprocess `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module pytest `
            --clean `
            main.py

      # ── 6. Verify the build ───────────────────────────────────────────────────
      - name: Verify build output
        run: |
          if (Test-Path "dist\ShanuFxDownloader.exe") {
            $size = (Get-Item "dist\ShanuFxDownloader.exe").Length / 1MB
            Write-Host "✓ Build successful! Size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Host "✗ Build FAILED — EXE not found"
            exit 1
          }
        shell: pwsh

      # ── 7. Upload as build artifact (available for 7 days) ───────────────────
      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShanuFxDownloader-Windows-EXE
          path: dist\ShanuFxDownloader.exe
          retention-days: 7

      # ── 8. Create GitHub Release (only on version tags like v1.0.0) ──────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Shanu Fx Private Downloader ${{ github.ref_name }}"
          body: |
            ## 🚀 Shanu Fx Private Downloader ${{ github.ref_name }}

            ### Download
            👇 **Click `ShanuFxDownloader.exe` below to download**

            ### What's included
            - ✅ Bundled FFmpeg (no separate install needed)
            - ✅ yt-dlp backend
            - ✅ Standalone — no Python required on target machine

            ### Requirements
            - Windows 10 / 11 (64-bit)

            ---
            Built automatically by GitHub Actions · by [Shanudha Tirosh](https://github.com/ShanudhaTirosh)
          files: dist\ShanuFxDownloader.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
